# Defines three services/containers for the Onus app
services:
  server:
  # Build using the dockerfile in the server dir
    build: 
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
    - ./server/.env
    # Have to have the database running before the server
    depends_on:
      - db
      - redis
    # Binds server work on local host machine to container's /app folder so whatever is in server/app/data is also in docker container
    volumes:
      - ./data:/app/data
      - ./server:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  client:
    # Build using the dockerfile in the client dir
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    # Have to have the server running before the client
    depends_on:
      - server
    # Mounts local source code to container's /app folder and keeps a seperate node_modules to persist installed libraries
    volumes:
      - ./client/onus_client:/app
      - /app/node_modules
    env_file:
    - ./client/.env

  db:
    # Use the postgres image for the database container
    image: postgres:15
    env_file:
    - ./server/.env
    ports:
      - "5432:5432"
    # Persist data in db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  migrate:
    build: ./server
    depends_on:
      - db
    command: alembic upgrade head

  redis:
    image: redis
    ports:
    - "6379:6379"
  
  redis-commander:
    image: rediscommander/redis-commander
    ports:
      - "8081:8081"
    environment:
      - "REDIS_HOSTS=local:redis:6379"

  celery:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    depends_on:
      - server       # or just redis if you prefer
      - redis
    volumes:
      - ./server:/app
      - ./data:/app/data
    command: celery -A app.agent.celery.onus_tasks worker --loglevel=INFO
volumes:
  postgres_data: